# Every dependency version, in one place.
#
# A version is only ever written here. A number typed into a build file
# instead is how two modules end up on two versions of the same library.
#
# Checked against Google's and Maven Central's own listings on 2026-08-06,
# not from memory. Newest stable of each, no alpha, beta or rc.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ktor = "3.2.0"
# Not 1.19.0, which is newer. 1.19.0 demands compileSdk 37, and the
# android-37 platform is not published yet - only its build-tools are. Raise
# this the day platforms;android-37 appears in sdkmanager.
coreKtx = "1.18.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
firebaseAppdistribution = "5.3.0"
# Checked on Maven Central 2026-08-11. Newest stable of each.
bouncycastle = "1.80"
sqlite = "3.49.1.0"
# Checked on Maven Central 2026-08-15. Newest stable of the 1.5 line.
logback = "1.5.18"
# Checked on Maven Central 2026-08-12. Renders the OpenFreeMap vector tiles.
# Not Google's: see ADR 0014.
maplibre = "11.11.0"

# Draws Compose to a PNG on this machine, with no phone and no emulator, so a
# component can be compared against the mock-up before anybody installs
# anything. Checked on Maven Central 2026-08-12: 4.15.1 is the newest stable.
robolectric = "4.15.1"
junit = "4.13.2"

# Runs a test on a real device or emulator, which Robolectric cannot: ML Kit
# is native code behind a Play Services shim and there is no JVM stand-in for
# it. Checked on Google's Maven 2026-08-14, newest stable of each.
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"

# Reading the QR on the cabinet screen. Checked against Google's Maven on
# 2026-08-14, not from memory: these are the newest stable of each.
#
# CameraX is 1.6.1 and not 1.7.0-alpha03, which is newer. Alpha is not
# stable, and the rule at the top of this file has not changed.
camerax = "1.6.1"
# The bundled model, not `play-services-mlkit-barcode-scanning`. Bundled
# costs about 2.5MB of APK and buys a scanner that works the first time a
# student stands at a locker, with no model to download first. See ADR 0018.
mlkit = "17.3.0"

# The fused location provider. Google Play Services is already here - ML Kit's
# barcode scanner drags in play-services-basement either way, which ADR 0018
# argued and accepted - so this adds a library, not a vendor, and no account
# or card. What it buys is the standard Android location API rather than our
# own provider-picking over the raw LocationManager: one fused answer from
# GPS, wifi, cell and the phone's own motion sensors, batched in hardware,
# with the battery cost expressed as a priority the platform honours.
playServicesLocation = "21.3.0"

# Google sign-in. Credential Manager is the platform API that replaced the
# old GoogleSignInClient, which Google deprecated: it asks the system for a
# credential and the system draws the account picker, so the app never sees a
# password and never handles an account list. `googleid` is the small library
# that turns what comes back into an ID token this app can post to endpoint
# 19. Neither reads `google-services.json` - the client id is passed in.
androidxCredentials = "1.5.0"
googleid = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# The BOM sets the version of every Compose library below it, so they can
# never drift apart. That is why none of them carry a version.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }

# Ktor server stack for the OTP sender server. Checked against Maven Central
# on 2026-08-09: 3.2.0 is the newest stable release.
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }

# Generates the development TLS certificate. Both front-ends refuse plain
# HTTP with no flag to turn it off, so the server serves TLS from the first
# commit and development needs a certificate to serve. See ADR 0020.
ktor-network-tls-certificates = { group = "io.ktor", name = "ktor-network-tls-certificates", version.ref = "ktor" }

# Catches the exception a refusal throws to stop a route, and turns anything
# unexpected into a 500 with no stack trace on the wire.
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktor" }
# The cabinet screen is a page on the Pi calling a server somewhere else, so
# every call it makes is cross-origin and a browser blocks it without this.
ktor-server-cors = { group = "io.ktor", name = "ktor-server-cors", version.ref = "ktor" }
# Per-caller request limits. The money guard is in Otp; this is the one that
# keeps a single host from occupying the server. See Hardening.kt.
ktor-server-rate-limit = { group = "io.ktor", name = "ktor-server-rate-limit", version.ref = "ktor" }
# HSTS, nosniff, and the rest, on every response.
ktor-server-default-headers = { group = "io.ktor", name = "ktor-server-default-headers", version.ref = "ktor" }

# Ktor logs through slf4j and needs a binding, or every line is swallowed and
# the server's log is the evidence a door opened. Checked on Maven Central
# 2026-08-15: newest stable.
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

# Argon2id, for password hashing. Bouncy Castle rather than a hand-written
# one: password hashing is where quiet mistakes cost the most, and this is
# pure Java with no native library to ship per platform.
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# SQLite, for the two things that must survive a restart: the password hash
# and the lockout counter. A file, no server to run. See ADR 0012.
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

# The real map on the Home card. MapLibre draws the tiles; the tiles come
# from OpenFreeMap, which needs no key and no account. Google wanted a card
# on file before it would serve a map it charges nothing for. See ADR 0014.
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

# The design-parity loop. Robolectric runs the Android graphics stack on the
# JVM; ui-test-junit4 puts a composable on a root and hands back the pixels.
# Roborazzi was the obvious third package here and is not used: with
# GraphicsMode.NATIVE these two already rasterise, and one screenshot library
# fewer is one fewer thing to keep on a version.
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# The camera, and the thing that reads a QR out of its frames. P5-02.
#
# camera-view carries PreviewView, which is the well-trodden path and the one
# every worked example uses. camera-compose exists at this version and would
# be Compose-native, but it hands you a SurfaceRequest to plumb yourself -
# more moving parts on the screen that has to work in a dark corridor.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Sends a build to the team's phones. Release plumbing only - it adds nothing
# to the app itself, and no Firebase SDK ships inside the APK.
firebase-appdistribution = { id = "com.google.firebase.appdistribution", version.ref = "firebaseAppdistribution" }
