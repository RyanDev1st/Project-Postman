# Every dependency version, in one place.
#
# A version is only ever written here. A number typed into a build file
# instead is how two modules end up on two versions of the same library.
#
# Checked against Google's and Maven Central's own listings on 2026-08-06,
# not from memory. Newest stable of each, no alpha, beta or rc.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ktor = "3.2.0"
# Not 1.19.0, which is newer. 1.19.0 demands compileSdk 37, and the
# android-37 platform is not published yet - only its build-tools are. Raise
# this the day platforms;android-37 appears in sdkmanager.
coreKtx = "1.18.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
firebaseAppdistribution = "5.3.0"
# Checked on Maven Central 2026-08-11. Newest stable of each.
bouncycastle = "1.80"
sqlite = "3.49.1.0"
# Checked on Maven Central 2026-08-12. Renders the OpenFreeMap vector tiles.
# Not Google's: see ADR 0014.
maplibre = "11.11.0"

# Draws Compose to a PNG on this machine, with no phone and no emulator, so a
# component can be compared against the mock-up before anybody installs
# anything. Checked on Maven Central 2026-08-12: 4.15.1 is the newest stable.
robolectric = "4.15.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# The BOM sets the version of every Compose library below it, so they can
# never drift apart. That is why none of them carry a version.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }

# Ktor server stack for the OTP sender server. Checked against Maven Central
# on 2026-08-09: 3.2.0 is the newest stable release.
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }

# Argon2id, for password hashing. Bouncy Castle rather than a hand-written
# one: password hashing is where quiet mistakes cost the most, and this is
# pure Java with no native library to ship per platform.
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

# SQLite, for the two things that must survive a restart: the password hash
# and the lockout counter. A file, no server to run. See ADR 0012.
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

# The real map on the Home card. MapLibre draws the tiles; the tiles come
# from OpenFreeMap, which needs no key and no account. Google wanted a card
# on file before it would serve a map it charges nothing for. See ADR 0014.
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

# The design-parity loop. Robolectric runs the Android graphics stack on the
# JVM; ui-test-junit4 puts a composable on a root and hands back the pixels.
# Roborazzi was the obvious third package here and is not used: with
# GraphicsMode.NATIVE these two already rasterise, and one screenshot library
# fewer is one fewer thing to keep on a version.
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Sends a build to the team's phones. Release plumbing only - it adds nothing
# to the app itself, and no Firebase SDK ships inside the APK.
firebase-appdistribution = { id = "com.google.firebase.appdistribution", version.ref = "firebaseAppdistribution" }
