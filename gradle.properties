# Gradle settings for this project. Machine-specific paths do not belong
# here - those go in local.properties, which git ignores.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build only what changed, and in parallel where it can.
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# Build only the resources for the ABIs and languages the build needs.
android.nonTransitiveRClass=true
