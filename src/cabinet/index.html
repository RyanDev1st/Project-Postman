<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VGU Smart Locker — Cabinet</title>

<!--
  The cabinet screen. A shipper uses this. It has no login, and anyone can
  walk up to it.

  P1-03: this is the skeleton. One screen, a version number, nothing else.
  No network call yet - that is P1-06.

  Nobody can tell us what screen this runs on (P0-02 is deferred), so the
  layout may never assume a size. Every measurement here is relative:
  clamp() against the viewport, never a fixed pixel width. Proved at
  1280x800 and 1920x1080 - see ADR 0009.
-->

<!--
  What this page is allowed to do, told to the browser.

  The server sends these headers on its own replies, but this page is not
  served by the server - it is files on the cabinet's own computer, handed
  over by whatever static server the Pi runs. So it has to say it itself.

  `default-src 'none'` then allows back only what is really used: our own
  scripts, our own stylesheets, images from here or inline data URLs, which
  is what the QR renderer draws into. Nothing may be loaded from anywhere
  else, so an injected `<script src="http://…">` is refused before it is
  fetched, and there is nowhere to send what is on the screen.

  `connect-src https:` is the interesting one. It makes the browser enforce
  the rule the code already keeps - this screen talks to its server over
  HTTPS and never plain HTTP - so a call that tried would be blocked by the
  browser as well as refused by net.js. The host cannot be named here
  because it is set per cabinet, in config.js.

  `frame-ancestors` is deliberately absent: a browser ignores it in a meta
  tag, and writing it here would read as protection that is not there. This
  screen is a kiosk and is not reachable from another page anyway.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https:; base-uri 'none'; form-action 'none'">

<link rel="stylesheet" href="screen.css">
<link rel="stylesheet" href="drop.css">
</head>
<body>

<main class="screen">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div class="names">
      <h1>VGU Smart Locker</h1>
      <p class="sub">Tủ gửi hàng thông minh</p>
    </div>
  </div>

  <!--
    Two columns, because the screen is 1024x600 - landscape and SHORT
    (ADR 0021). Stacking the shipper's flow above the QR would push one of
    them off a 600px screen, and both have to be usable at once: a receiver
    can walk up to collect while a shipper is still typing.

    The columns fold to one on a screen too narrow for two, so this still
    opens in a desktop browser, which is where it is built.
  -->
  <div class="halves">

    <!--
      P3-01 to P3-03, P3-06 - the shipper's whole journey. One step is
      visible at a time; drop.js hides the rest.

      Nothing here decides anything. It asks the server for the name and
      asks the server for a box. Rule 2 in architecture.md.
    -->
    <section class="drop" id="drop">

      <div class="step" data-step="idle">
        <button class="go" id="start" type="button">Deliver a parcel</button>
        <p class="go-sub">Gửi hàng</p>
      </div>

      <div class="step" data-step="number" hidden>
        <p class="ask">Receiver's phone number</p>
        <!--
          What the shipper is typing, shown back to them. The rule against
          showing a phone number on this screen is about the RECEIVER's
          stored details, which a stranger must not be able to read off a
          public terminal. This is the shipper's own keystrokes, and a
          number they cannot check is a number they cannot correct. It is
          cleared the moment this step is left.
        -->
        <p class="typed" id="typed">+84</p>
        <div class="pad" id="pad"></div>
      </div>

      <div class="step" data-step="confirm" hidden>
        <p class="ask">Is this the right person?</p>
        <p class="who" id="who">—</p>
        <div class="row">
          <button class="ghost" id="no" type="button">No</button>
          <button class="go" id="yes" type="button">Yes, open a box</button>
        </div>
      </div>

      <div class="step" data-step="open" hidden>
        <p class="ask">Put the parcel in</p>
        <p class="boxno" id="boxno">—</p>
        <p class="go-sub">Close the door when you are done.</p>
        <button class="go" id="shut" type="button">The door is shut</button>
      </div>

      <div class="step" data-step="trouble" hidden>
        <p class="ask" id="trouble-say">—</p>
        <button class="ghost" id="again" type="button">Start again</button>
      </div>

    </section>

    <!--
      P5-01: the QR session code. The receiver's phone scans this - never the
      other way round (ADR 0003).

      It is not a key. It says which cabinet and at what moment, and nothing
      else, so a photograph of this screen opens no door. See qr.js.
    -->
    <section class="qr-panel">
      <canvas id="qr" width="264" height="264" aria-label="Scan this code with the VGU Smart Locker app"></canvas>
      <p class="qr-say">Scan to collect · Quét để nhận hàng</p>
      <p class="qr-note"><span id="qr-note">New code in</span> <b id="qr-count">—</b></p>
    </section>

  </div>

  <footer class="foot">
    <span class="cabinet-id">Cabinet <b id="cabinet-id">—</b></span>
    <span class="version">v<b id="version">—</b></span>
    <span class="size" id="size">—</span>
  </footer>
</main>

<!--
  config.js holds this cabinet's key and server address. It is placed on the
  device at setup and is git-ignored, so it is missing here and on any fresh
  clone - that is correct, not broken. net.js says "this cabinet has no key
  yet" rather than calling with nothing. See config.example.js.

  It used to carry onerror="void 0" to swallow the 404 on a fresh clone. That
  is an inline handler, which the policy above refuses, and it silenced a
  message worth seeing. A 404 in the console on a machine with no config is
  the truth.
-->
<script src="config.js"></script>
<script src="version.js"></script>
<script src="net.js"></script>
<!--
  node-qrcode, vendored. 20.8M npm downloads a week against 8.2K stars - the
  production default by a wide margin, and the star leader in this category
  turned out to be a library nobody installs any more.

  Vendored rather than linked: this screen has no build step, and a cabinet
  in a lobby cannot depend on a CDN being reachable to draw the one thing a
  person walked up to it for. checknet.py enforces the same rule from the
  other side - nothing but net.js may touch the network.

  Pinned at 1.5.1, which is the last release that ships a browser build at
  all; 1.5.3 and 1.5.4 dropped it and need a bundler. See vendor/README.md.
-->
<script src="vendor/qrcode.js"></script>
<script src="qr.js"></script>
<script src="drop.js"></script>
<script src="screen.js"></script>
</body>
</html>
