<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VGU Smart Locker — Cabinet</title>

<!--
  The cabinet screen. A shipper uses this. It has no login, and anyone can
  walk up to it.

  P1-03: this is the skeleton. One screen, a version number, nothing else.
  No network call yet - that is P1-06.

  Nobody can tell us what screen this runs on (P0-02 is deferred), so the
  layout may never assume a size. Every measurement here is relative:
  clamp() against the viewport, never a fixed pixel width. Proved at
  1280x800 and 1920x1080 - see ADR 0009.
-->

<link rel="stylesheet" href="screen.css">
</head>
<body>

<main class="screen">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div class="names">
      <h1>VGU Smart Locker</h1>
      <p class="sub">Tủ gửi hàng thông minh</p>
    </div>
  </div>

  <!--
    A skeleton is honest about being a skeleton. A public terminal showing a
    dead "Deliver a parcel" button teaches a shipper it is broken. This says
    what it is until P3-01 puts the real button here.
  -->
  <div class="slot">
    <p class="waiting">Not in service yet</p>
    <p class="hint">Chưa hoạt động</p>
  </div>

  <!--
    P5-01: the QR session code. The receiver's phone scans this - never the
    other way round (ADR 0003).

    It is not a key. It says which cabinet and at what moment, and nothing
    else, so a photograph of this screen opens no door. See qr.js.
  -->
  <section class="qr-panel">
    <canvas id="qr" width="264" height="264" aria-label="Scan this code with the VGU Smart Locker app"></canvas>
    <p class="qr-say">Scan to collect · Quét để nhận hàng</p>
    <p class="qr-note"><span id="qr-note">New code in</span> <b id="qr-count">—</b></p>
  </section>

  <footer class="foot">
    <span class="cabinet-id">Cabinet <b id="cabinet-id">—</b></span>
    <span class="version">v<b id="version">—</b></span>
    <span class="size" id="size">—</span>
  </footer>
</main>

<!--
  config.js holds this cabinet's key and server address. It is placed on the
  device at setup and is git-ignored, so it is missing here and on any fresh
  clone - that is correct, not broken. net.js says "this cabinet has no key
  yet" rather than calling with nothing. See config.example.js.
-->
<script src="config.js" onerror="void 0"></script>
<script src="version.js"></script>
<script src="net.js"></script>
<!--
  node-qrcode, vendored. 20.8M npm downloads a week against 8.2K stars - the
  production default by a wide margin, and the star leader in this category
  turned out to be a library nobody installs any more.

  Vendored rather than linked: this screen has no build step, and a cabinet
  in a lobby cannot depend on a CDN being reachable to draw the one thing a
  person walked up to it for. checknet.py enforces the same rule from the
  other side - nothing but net.js may touch the network.

  Pinned at 1.5.1, which is the last release that ships a browser build at
  all; 1.5.3 and 1.5.4 dropped it and need a bundler. See vendor/README.md.
-->
<script src="vendor/qrcode.js"></script>
<script src="qr.js"></script>
<script src="screen.js"></script>
</body>
</html>
