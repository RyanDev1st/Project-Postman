<!doctype html>
<!-- Scratch. A reference harness: the real CSS and the real liquid-glass
     script, over a busy backdrop, so each material can be photographed and
     compared against the Compose port. Not part of the mock-up.

     Markup is lifted from body.html verbatim - a paraphrase here would put
     the harness in the same guessing game the port has been losing. -->
<html data-theme="dark">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="screens.css"/>
<link rel="stylesheet" href="glass.css"/>
<style>
  @font-face { font-family: Geist; src: url(geist.woff2) format("woff2"); }
  @font-face { font-family: "Geist Mono"; src: url(geistmono.woff2) format("woff2"); }
  body { margin: 0; font-family: Geist, system-ui, sans-serif;
         background: var(--ground); color: var(--ink); }
  .stage { width: 390px; padding: 0 17px 40px; box-sizing: border-box; }
  h4 { color: var(--ink-2); font: 600 11px Geist; letter-spacing: .1em;
       text-transform: uppercase; margin: 26px 0 7px; }
  /* `.nav` is position:absolute with left/right/bottom (glass.css 597), so it
     needs a positioned box of a known height to lay out in. In the app that
     box is `.screen`. Here it is this. */
  .screen { position: relative; height: 128px; }
  /* Something for the glass to bend. Text under the nav is the exact case
     that failed in the port: COLLECTED could be read straight through it. */
  .under { font-size: 30px; font-weight: 700; letter-spacing: .06em;
           color: var(--ink); opacity: .9; margin: 6px 0; }
  .row { display: flex; gap: 10px; align-items: center; }
  /* A reference is a still. Every state here is set in the markup, so any
     transition that runs is a frame caught half way - which is what put the
     moon off the sun in the first capture. */
  *, *::before, *::after { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div class="stage">

  <!-- `.card` carries no radius of its own - every user sets one. 18px is
       what `.ticket.card` uses. -->
  <h4>card</h4>
  <div class="card" style="padding:14px;border-radius:18px">
    <div style="font-weight:600">Minh Nguyễn</div>
    <div style="color:var(--ink-2);font-family:'Geist Mono'">0912 345 678</div>
  </div>

  <!-- The number chip is `.ledger .no` - 34px square, radius 10 - so it needs
       the ledger to be sized at all. -->
  <h4>recess — number chip, and a field</h4>
  <ul class="ledger" style="list-style:none;margin:0;padding:0">
    <li style="display:flex;gap:10px;align-items:center;border-top:0">
      <span class="no mono recess">04</span>
      <span class="no mono recess">17</span>
      <div class="recess" style="flex:1;height:44px;border-radius:14px"></div>
    </li>
  </ul>

  <h4>lg — nav, floating over content</h4>
  <div class="screen">
    <div class="under">COLLECTED</div>
    <div class="under" style="color:var(--accent)">04 · BACK GATE</div>
    <nav class="nav lg lg-pop" role="tablist" aria-label="Sections">
      <button role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
      <button role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>Cabinet</button>
      <button role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17.5 7H20M4 12h3M11.5 12H20M4 17h9M17.5 17H20"/><circle cx="15" cy="7" r="2.1"/><circle cx="9" cy="12" r="2.1"/><circle cx="15" cy="17" r="2.1"/></svg>Settings</button>
    </nav>
  </div>

  <h4>lg-bead — app bar controls</h4>
  <div style="position:relative">
    <div class="under" style="margin-bottom:-40px">07 14:20</div>
    <div class="row">
      <button class="dot-btn lg lg-bead" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="dot-btn lg lg-bead" aria-label="Bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
    </div>
  </div>

  <h4>theme switch — day, then night</h4>
  <div class="row" id="switches"></div>

</div>
<script>
// Both states of the switch, side by side, from body.html's own markup. The
// only edit is aria-pressed, which is the whole difference between them.
const SWITCH = `<button class="theme-switch" aria-pressed="PRESSED" aria-label="Dark mode"><span class="theme-switch__container"><span class="theme-switch__clouds"></span><span class="theme-switch__stars-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 55" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M135.831 3.00688C135.055 3.85027 134.111 4.29946 133 4.35447C134.111 4.40947 135.055 4.85867 135.831 5.71123C136.607 6.55462 136.996 7.56303 136.996 8.72727C136.996 7.95722 137.172 7.25134 137.525 6.59129C137.886 5.93124 138.372 5.39954 138.98 5.00535C139.598 4.60199 140.268 4.39114 141 4.35447C139.88 4.2903 138.936 3.85027 138.16 3.00688C137.384 2.16348 136.996 1.16425 136.996 0C136.996 1.16425 136.607 2.16348 135.831 3.00688ZM31 23.3545C32.1114 23.2995 33.0551 22.8503 33.8313 22.0069C34.6075 21.1635 34.9956 20.1642 34.9956 19C34.9956 20.1642 35.3837 21.1635 36.1599 22.0069C36.9361 22.8503 37.8798 23.2903 39 23.3545C38.2679 23.3911 37.5976 23.602 36.9802 24.0053C36.3716 24.3995 35.8864 24.9312 35.5248 25.5913C35.172 26.2513 34.9956 26.9572 34.9956 27.7273C34.9956 26.563 34.6075 25.5546 33.8313 24.7112C33.0551 23.8587 32.1114 23.4095 31 23.3545ZM0 36.3545C1.11136 36.2995 2.05513 35.8503 2.83131 35.0069C3.6075 34.1635 3.99559 33.1642 3.99559 32C3.99559 33.1642 4.38368 34.1635 5.15987 35.0069C5.93605 35.8503 6.87982 36.2903 8 36.3545C7.26792 36.3911 6.59757 36.602 5.98015 37.0053C5.37155 37.3995 4.88644 37.9312 4.52481 38.5913C4.172 39.2513 3.99559 39.9572 3.99559 40.7273C3.99559 39.563 3.6075 38.5546 2.83131 37.7112C2.05513 36.8587 1.11136 36.4095 0 36.3545ZM56.8313 24.0069C56.0551 24.8503 55.1114 25.2995 54 25.3545C55.1114 25.4095 56.0551 25.8587 56.8313 26.7112C57.6075 27.5546 57.9956 28.563 57.9956 29.7273C57.9956 28.9572 58.172 28.2513 58.5248 27.5913C58.8864 26.9312 59.3716 26.3995 59.9802 26.0053C60.5976 25.602 61.2679 25.3911 62 25.3545C60.8798 25.2903 59.9361 24.8503 59.1599 24.0069C58.3837 23.1635 57.9956 22.1642 57.9956 21C57.9956 22.1642 57.6075 23.1635 56.8313 24.0069ZM81 25.3545C82.1114 25.2995 83.0551 24.8503 83.8313 24.0069C84.6075 23.1635 84.9956 22.1642 84.9956 21C84.9956 22.1642 85.3837 23.1635 86.1599 24.0069C86.9361 24.8503 87.8798 25.2903 89 25.3545C88.2679 25.3911 87.5976 25.602 86.9802 26.0053C86.3716 26.3995 85.8864 26.9312 85.5248 27.5913C85.172 28.2513 84.9956 28.9572 84.9956 29.7273C84.9956 28.563 84.6075 27.5546 83.8313 26.7112C83.0551 25.8587 82.1114 25.4095 81 25.3545ZM136 36.3545C137.111 36.2995 138.055 35.8503 138.831 35.0069C139.607 34.1635 139.996 33.1642 139.996 32C139.996 33.1642 140.384 34.1635 141.16 35.0069C141.936 35.8503 142.88 36.2903 144 36.3545C143.268 36.3911 142.598 36.602 141.98 37.0053C141.372 37.3995 140.886 37.9312 140.525 38.5913C140.172 39.2513 139.996 39.9572 139.996 40.7273C139.996 39.563 139.607 38.5546 138.831 37.7112C138.055 36.8587 137.111 36.4095 136 36.3545ZM101.831 49.0069C101.055 49.8503 100.111 50.2995 99 50.3545C100.111 50.4095 101.055 50.8587 101.831 51.7112C102.607 52.5546 102.996 53.563 102.996 54.7273C102.996 53.9572 103.172 53.2513 103.525 52.5913C103.886 51.9312 104.372 51.3995 104.98 51.0053C105.598 50.602 106.268 50.3911 107 50.3545C105.88 50.2903 104.936 49.8503 104.16 49.0069C103.384 48.1635 102.996 47.1642 102.996 46C102.996 47.1642 102.607 48.1635 101.831 49.0069Z" fill="currentColor"/></svg></span><span class="theme-switch__circle-container"><span class="theme-switch__sun-moon-container"><span class="theme-switch__moon"><span class="theme-switch__spot"></span><span class="theme-switch__spot"></span><span class="theme-switch__spot"></span></span></span></span></span></button>`;
document.getElementById("switches").innerHTML =
  SWITCH.replace("PRESSED", "false") + SWITCH.replace("PRESSED", "true");

// Inspect mode: `#block=<n>&zoom=<n>` keeps one section and blows it up, so a
// component can be measured at pixel scale instead of guessed at from a
// 390px-wide contact sheet. The sections are the h4s, in order.
const q = new URLSearchParams(location.hash.slice(1));
if (q.has("block")) {
  const heads = [...document.querySelectorAll("h4")];
  const keep = heads[+q.get("block")];
  const stage = document.querySelector(".stage");
  let on = false;
  [...stage.children].forEach(el => {
    if (el.tagName === "H4") on = (el === keep);
    // The heading goes too - it is harness furniture, and at zoom it pushes
    // the thing being measured off the bottom of the window.
    if (!on || el === keep) el.style.display = "none";
  });
  stage.style.padding = "0";
  stage.style.zoom = q.get("zoom") || 4;
}

// Measure mode: `#probe=<selector>` prints each match's box and the handful of
// computed properties a port has to reproduce. Numbers beat squinting at a
// screenshot, and these are the numbers the Compose side must equal.
if (q.has("probe")) {
  const want = ["transform", "backgroundColor", "borderRadius", "boxShadow",
                "padding", "gap", "fontSize", "fontWeight", "letterSpacing",
                "color", "width", "height", "left", "top", "overflow"];
  const out = [...document.querySelectorAll(q.get("probe"))].map((el, i) => {
    const c = getComputedStyle(el), r = el.getBoundingClientRect();
    const o = { i, sel: el.className || el.tagName,
                box: [r.x, r.y, r.width, r.height].map(n => +n.toFixed(2)) };
    want.forEach(k => { if (c[k] && c[k] !== "none" && c[k] !== "normal") o[k] = c[k]; });
    return o;
  });
  document.body.textContent = JSON.stringify(out, null, 1);
  document.body.style.cssText = "color:#fff;font:12px monospace;white-space:pre";
}
</script>
<script src="liquid.js"></script>
</body>
</html>
